<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#1A7F74" stroke-opacity="0.4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- open book -->
    <g transform="translate(28,30)">
      <path d="M0 4c8-6 18-6 24 0v26c-6-5-16-5-24 0z" />
      <path d="M48 4c-8-6-18-6-24 0v26c6-5 16-5 24 0z" />
      <path d="M24 4v26" />
    </g>
    <!-- pencil -->
    <g transform="translate(190,20) rotate(35)">
      <path d="M0 24 4 8 20 0l4 4-8 16-16 4z" />
      <path d="M4 8l8 8" />
    </g>
    <!-- star -->
    <g transform="translate(110,90)">
      <path d="M14 0l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" />
    </g>
    <!-- speech bubble -->
    <g transform="translate(230,110)">
      <path d="M0 6a6 6 0 0 1 6-6h28a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H14l-8 8v-8H6a6 6 0 0 1-6-6z" />
      <path d="M8 10h24M8 17h16" />
    </g>
    <!-- graduation cap -->
    <g transform="translate(30,150)">
      <path d="M0 6 24 0l24 6-24 6z" />
      <path d="M10 9v10c0 3 6 6 14 6s14-3 14-6V9" />
      <path d="M44 8v14" />
    </g>
    <!-- abc blocks -->
    <g transform="translate(160,190)">
      <rect x="0" y="0" width="16" height="16" rx="3" />
      <rect x="20" y="0" width="16" height="16" rx="3" />
      <text x="8" y="12" font-size="10" text-anchor="middle" stroke="none" fill="#1A7F74" fill-opacity="0.4" font-family="sans-serif">A</text>
      <text x="28" y="12" font-size="10" text-anchor="middle" stroke="none" fill="#1A7F74" fill-opacity="0.4" font-family="sans-serif">B</text>
    </g>
    <!-- checkmark badge -->
    <g transform="translate(250,230)">
      <circle cx="12" cy="12" r="12" />
      <path d="M6 12l4 4 8-8" />
    </g>
    <!-- second small star -->
    <g transform="translate(70,250) scale(0.7)">
      <path d="M14 0l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" />
    </g>
    <!-- second pencil -->
    <g transform="translate(0,220) rotate(-20)">
      <path d="M0 24 4 8 20 0l4 4-8 16-16 4z" />
      <path d="M4 8l8 8" />
    </g>
